name: Atualizar Dashboard

on:
  schedule:
    - cron: '0 */6 * * *'   # a cada 6 horas (horários UTC: 00:00, 06:00, 12:00, 18:00)
  workflow_dispatch:         # permite rodar manualmente pelo botão "Run workflow" no GitHub
  push:
    branches: [main]
    paths:
      - 'dashboard.py'
      - 'dashboard.html'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pandas requests

      - name: Rodar dashboard.py
        run: python dashboard.py

      - name: Commit e push do index.html atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html imgs/
          if git diff --cached --quiet; then
            echo "Nada mudou, sem commit."
          else
            git commit -m "Atualização automática do dashboard - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
